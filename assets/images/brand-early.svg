  <line x1="0" y1="248" x2="400" y2="248" stroke="#22262C" stroke-width="2"/>
  <!-- small child sitting -->
  <circle cx="150" cy="140" r="24" stroke="#22262C" stroke-width="2.5"/>
  <path d="M128 140 q22 -30 44 0" stroke="#22262C" stroke-width="2.5"/>
  <circle cx="140" cy="138" r="2.5" fill="#22262C"/>
  <circle cx="160" cy="138" r="2.5" fill="#22262C"/>
