  <path d="M118 246 q4 -60 32 -64 q28 4 32 64 z" fill="#D9A62E" opacity=".9" stroke="#22262C" stroke-width="2"/>
  <!-- alphabet blocks -->
  <g stroke="#22262C" stroke-width="2">
    <rect x="220" y="196" width="40" height="40" fill="#6E9CC0"/>
    <rect x="264" y="196" width="40" height="40" fill="#3E6E8E"/>
    <rect x="242" y="154" width="40" height="40" fill="#D9A62E"/>
  </g>
  <text x="240" y="223" font-family="Georgia,serif" font-size="22" fill="#F3EEE1" text-anchor="middle">A</text>
  <text x="284" y="223" font-family="Georgia,serif" font-size="22" fill="#F3EEE1" text-anchor="middle">B</text>
  <text x="262" y="181" font-family="Georgia,serif" font-size="22" fill="#F3EEE1" text-anchor="middle">C</text>
  <!-- teddy bear simple -->
  <circle cx="90" cy="210" r="16" stroke="#22262C" stroke-width="2" fill="#F3EEE1"/>
  <circle cx="78" cy="196" r="7" stroke="#22262C" stroke-width="1.8" fill="#F3EEE1"/>
  <circle cx="104" cy="196" r="7" stroke="#22262C" stroke-width="1.8" fill="#F3EEE1"/>
  <circle cx="90" cy="212" r="9" stroke="#22262C" stroke-width="1.5" fill="none"/>
  <!-- floating stars -->
  <path d="M330 90 l4 9 l10 1 l-7 7 l2 10 l-9 -5 l-9 5 l2 -10 l-7 -7 l10 -1 z" fill="#D9A62E" opacity=".85"/>
  <path d="M60 90 l3 6 l7 1 l-5 5 l1 7 l-6 -3 l-6 3 l1 -7 l-5 -5 l7 -1 z" fill="#6E9CC0" opacity=".85"/>
