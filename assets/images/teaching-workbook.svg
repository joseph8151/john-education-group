<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" fill="none">
  <rect width="300" height="400" fill="#F6F1E8"/>
  <!-- workbook cover -->
  <rect x="60" y="70" width="180" height="240" rx="4" fill="#202224" stroke="#202224" stroke-width="2.2"/>
  <rect x="80" y="110" width="140" height="12" fill="#F6F1E8" opacity=".9"/>
  <rect x="80" y="132" width="90" height="8" fill="#F6F1E8" opacity=".6"/>
  <!-- spiral binding -->
  <g stroke="#202224" stroke-width="2">
    <circle cx="60" cy="90" r="5" fill="#F6F1E8"/>
    <circle cx="60" cy="130" r="5" fill="#F6F1E8"/>
    <circle cx="60" cy="170" r="5" fill="#F6F1E8"/>
    <circle cx="60" cy="210" r="5" fill="#F6F1E8"/>
    <circle cx="60" cy="250" r="5" fill="#F6F1E8"/>
    <circle cx="60" cy="290" r="5" fill="#F6F1E8"/>
  </g>
  <!-- worksheet lines with checkmarks -->
  <rect x="80" y="170" width="140" height="120" fill="#F6F1E8"/>
  <line x1="94" y1="190" x2="180" y2="190" stroke="#202224" stroke-width="1.4" opacity=".6"/>
  <path d="M188 186 l6 6 l12 -14" stroke="#C6A76A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="94" y1="216" x2="180" y2="216" stroke="#202224" stroke-width="1.4" opacity=".6"/>
  <path d="M188 212 l6 6 l12 -14" stroke="#C6A76A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="94" y1="242" x2="180" y2="242" stroke="#202224" stroke-width="1.4" opacity=".6"/>
  <line x1="94" y1="268" x2="150" y2="268" stroke="#202224" stroke-width="1.4" opacity=".6"/>
  <!-- pencil across -->
  <line x1="110" y1="330" x2="200" y2="300" stroke="#202224" stroke-width="3" stroke-linecap="round"/>
  <path d="M200 300 l7 -4 l-4 9 z" fill="#C6A76A"/>
</svg>
