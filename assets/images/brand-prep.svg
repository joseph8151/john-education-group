<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#E9E0D2"/>
  <!-- desk -->
  <line x1="30" y1="220" x2="370" y2="220" stroke="#202224" stroke-width="2.5"/>
  <line x1="50" y1="220" x2="50" y2="266" stroke="#202224" stroke-width="2.5"/>
  <line x1="350" y1="220" x2="350" y2="266" stroke="#202224" stroke-width="2.5"/>
  <!-- student: seated figure, focused writing -->
  <circle cx="190" cy="108" r="26" stroke="#202224" stroke-width="2.5"/>
  <path d="M164 108 q26 -34 52 0" stroke="#202224" stroke-width="2.5"/>
  <path d="M150 220 q6 -70 40 -76 h0 q34 6 40 76" stroke="#202224" stroke-width="2.5" fill="#202224" opacity=".9"/>
  <path d="M186 156 q6 20 26 20 q20 0 26 -20" stroke="#202224" stroke-width="2"/>
  <!-- open book / test paper -->
  <path d="M150 210 h80 v10 h-80 z" fill="#F6F1E8" stroke="#202224" stroke-width="2"/>
  <line x1="190" y1="210" x2="190" y2="220" stroke="#202224" stroke-width="1.5"/>
  <line x1="160" y1="214" x2="180" y2="214" stroke="#202224" stroke-width="1"/>
  <line x1="200" y1="214" x2="222" y2="214" stroke="#202224" stroke-width="1"/>
  <!-- clock on wall -->
  <circle cx="320" cy="70" r="26" stroke="#202224" stroke-width="2.5"/>
  <line x1="320" y1="70" x2="320" y2="54" stroke="#202224" stroke-width="2"/>
  <line x1="320" y1="70" x2="332" y2="76" stroke="#202224" stroke-width="2"/>
  <!-- stacked books left -->
  <rect x="66" y="196" width="58" height="12" fill="#202224"/>
  <rect x="70" y="184" width="50" height="12" fill="#A8884A"/>
  <rect x="66" y="172" width="58" height="12" fill="#C6A76A"/>
  <!-- pencil -->
  <line x1="240" y1="204" x2="270" y2="188" stroke="#202224" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M270 188 l6 -3 l-3 8 z" fill="#C6A76A"/>
  <!-- checkmark accent -->
  <path d="M300 200 l10 10 l20 -22" stroke="#202224" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
